name: Build CleanSpace APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for the APK"
        required: false
        default: "cleanspace-app"
  push:
    branches: [main]
    paths:
      - "android-cleaner/**"
      - ".github/workflows/build-cleanspace.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew exec
        working-directory: android-cleaner
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android-cleaner
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          echo "## Gradle build log (errors)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|^> |FAILED|Caused by|Exception|Unresolved|BUILD " /tmp/build.log | tail -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Report build result to repo (self-check)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          result="UNKNOWN"
          grep -q "BUILD SUCCESSFUL" /tmp/build.log 2>/dev/null && result="SUCCESS"
          grep -q "BUILD FAILED" /tmp/build.log 2>/dev/null && result="FAILED"
          {
            echo "# CleanSpace build status"
            echo
            echo "- commit: ${{ github.sha }}"
            echo "- time: $(date -u +'%Y-%m-%d %H:%M:%SZ')"
            echo "- result: $result"
            echo
            echo "## Error lines (if failed)"
            echo '```'
            grep -E "^e: |error:|FAILED|Caused by|Unresolved|Exception" /tmp/build.log 2>/dev/null | tail -60 || echo "(no errors / no log)"
            echo '```'
          } > BUILD_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_STATUS.md
          git commit -m "ci: CleanSpace build status = $result [skip ci]" || { echo "no change"; exit 0; }
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed status"; break
            fi
            sleep 3
          done

      - name: Locate APK
        id: apk
        working-directory: android-cleaner
        run: |
          apk=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=android-cleaner/$apk" >> $GITHUB_OUTPUT
          ls -la "$apk"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanSpace-APK
          path: android-cleaner/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || 'cleanspace-app' }}
        run: |
          REPO="${{ github.repository }}"
          APK="${{ steps.apk.outputs.path }}"
          [ -f "$APK" ] || { echo "::error::APK not found"; exit 1; }

          rel=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          rel_id=$(echo "$rel" | jq -r '.id // empty')

          if [ -z "$rel_id" ]; then
            create=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"CleanSpace APK\",\"body\":\"Android storage analyzer and batch cleaner. No ads.\"}" \
              "https://api.github.com/repos/$REPO/releases")
            rel_id=$(echo "$create" | jq -r '.id // empty')
          fi
          [ -n "$rel_id" ] || { echo "::error::no release id"; exit 1; }

          # delete existing same-named asset (overwrite)
          assets=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/$rel_id/assets")
          for aid in $(echo "$assets" | jq -r '.[] | select(.name=="CleanSpace.apk") | .id'); do
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/assets/$aid"
          done

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$REPO/releases/$rel_id/assets?name=CleanSpace.apk" \
            -o /tmp/up.json
          url=$(jq -r '.browser_download_url // empty' /tmp/up.json)
          echo "## APK build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download: $url" >> $GITHUB_STEP_SUMMARY
