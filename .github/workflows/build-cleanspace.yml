name: Build CleanSpace APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for the APK"
        required: false
        default: "cleanspace-app"
  push:
    branches: [main]
    paths:
      - "android-cleaner/**"
      - ".github/workflows/build-cleanspace.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew exec
        working-directory: android-cleaner
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android-cleaner
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          echo "## Gradle build log (errors)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|^> |FAILED|Caused by|Exception|Unresolved|BUILD " /tmp/build.log | tail -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Publish build log to a release (self-check)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          TAG="build-log"
          result="UNKNOWN"
          grep -q "BUILD SUCCESSFUL" /tmp/build.log 2>/dev/null && result="SUCCESS"
          grep -q "BUILD FAILED" /tmp/build.log 2>/dev/null && result="FAILED"

          # 에러 요약 파일
          {
            echo "commit: ${{ github.sha }}"
            echo "time: $(date -u +'%Y-%m-%d %H:%M:%SZ')"
            echo "result: $result"
            echo "----- error lines -----"
            grep -E "^e: |error:|FAILED|Caused by|Unresolved|Exception" /tmp/build.log 2>/dev/null | tail -80 || echo "(none)"
          } > /tmp/status.txt

          # build-log 릴리즈 생성/조회
          rel=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          rel_id=$(echo "$rel" | jq -r '.id // empty')
          if [ -z "$rel_id" ]; then
            rel_id=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"CI build log\",\"body\":\"latest gradle build log + status\"}" \
              "https://api.github.com/repos/$REPO/releases" | jq -r '.id // empty')
          fi
          [ -n "$rel_id" ] || { echo "no release"; exit 0; }

          # 기존 에셋 삭제 후 재업로드
          assets=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/$rel_id/assets")
          for aid in $(echo "$assets" | jq -r '.[] | select(.name=="status.txt" or .name=="build.log") | .id'); do
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/assets/$aid"
          done
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain" \
            --data-binary "@/tmp/status.txt" \
            "https://uploads.github.com/repos/$REPO/releases/$rel_id/assets?name=status.txt" >/dev/null
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain" \
            --data-binary "@/tmp/build.log" \
            "https://uploads.github.com/repos/$REPO/releases/$rel_id/assets?name=build.log" >/dev/null
          echo "published status=$result to release $TAG"

      - name: Locate APK
        id: apk
        working-directory: android-cleaner
        run: |
          apk=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=android-cleaner/$apk" >> $GITHUB_OUTPUT
          ls -la "$apk"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanSpace-APK
          path: android-cleaner/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || 'cleanspace-app' }}
        run: |
          REPO="${{ github.repository }}"
          APK="${{ steps.apk.outputs.path }}"
          [ -f "$APK" ] || { echo "::error::APK not found"; exit 1; }

          rel=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          rel_id=$(echo "$rel" | jq -r '.id // empty')

          if [ -z "$rel_id" ]; then
            create=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"CleanSpace APK\",\"body\":\"Android storage analyzer and batch cleaner. No ads.\"}" \
              "https://api.github.com/repos/$REPO/releases")
            rel_id=$(echo "$create" | jq -r '.id // empty')
          fi
          [ -n "$rel_id" ] || { echo "::error::no release id"; exit 1; }

          # delete existing same-named asset (overwrite)
          assets=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/$rel_id/assets")
          for aid in $(echo "$assets" | jq -r '.[] | select(.name=="CleanSpace.apk") | .id'); do
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/assets/$aid"
          done

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$REPO/releases/$rel_id/assets?name=CleanSpace.apk" \
            -o /tmp/up.json
          url=$(jq -r '.browser_download_url // empty' /tmp/up.json)
          echo "## APK build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download: $url" >> $GITHUB_STEP_SUMMARY
